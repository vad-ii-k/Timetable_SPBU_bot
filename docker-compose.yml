x-common: &common
    restart: always
    network_mode: host
    environment:
        TZ: Europe/Moscow

services:
    timetable-tgbot:
        <<: *common
        shm_size: 512mb
        build:
            context: .
            dockerfile: dockerfile
        env_file: .env
        depends_on:
            - postgres
            - redis
        # Список из одного элемента: иначе Compose режет строки на argv,
        # и /bin/sh -c получает только «python» → exit 0 и restart-loop.
        command:
            - |
                python -m alembic upgrade head
                poetry run python bot.py

    redis:
        <<: *common
        image: redis:7.2-alpine
        command: --requirepass ${REDIS_PASSWORD}
        volumes:
            - redis-data:/data

    postgres:
        <<: *common
        image: postgres:14.23-alpine
        environment:
            TZ: Europe/Moscow
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASS}
        volumes:
            - postgres-data:/var/lib/postgresql/data

volumes:
    redis-data:
    postgres-data:
