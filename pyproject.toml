[tool.poetry]
name = "timetable-spbu-bot"
version = "2.0"
description = ""
authors = ["vad-ii-k <sazanov7615@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
aiogram = "^3.29.0"
aiohttp-socks = "^0.10.1"
alembic = "^1.13.2"
apscheduler = "^3.10.4"
babel = "^2.16.0"
cashews = "^7.3.0"
environs = "^14.0.0"
gino = "^1.0.1"
jinja2 = "^3.1.4"
playwright = "^1.46.0"
psycopg2-binary = "^2.9.9"
python = ">=3.12,<3.15"
redis = "^5.0.8"
setuptools = "^83.0.0"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
isort = "^5.13.2"
pdoc = "^14.6.1"
pylint = "^3.2.6"
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"

[tool.black]
target-version = ['py312']
line-length = 120

[tool.isort]
profile = "black"
multi_line_output = 3
combine_as_imports = true
line_length = 120

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120 # Maximum number of lines in a module.
disable = 'R0903, E0213, C0209' # too-few-public-methods, no-self-argument, consider-using-f-string
extension-pkg-whitelist = "pydantic"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
